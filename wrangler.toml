# Relay Worker config. Lives at the repo root so Cloudflare Workers Builds can deploy
# with default settings; Wrangler also finds it when run from relay/.
name = "claude-files-relay"
main = "relay/src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object instance per secret token. It holds the WebSocket from the
# iOS app and forwards MCP tool calls from Claude to it.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "DeviceRelay"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceRelay"]
