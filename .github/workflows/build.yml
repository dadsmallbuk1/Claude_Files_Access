name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    name: Relay (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    name: iOS app (tests + unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Build against the newest iOS SDK available. Apps built with an older SDK run
      # in a compatibility mode on newer iOS, which can break system views like the
      # Files folder picker.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|release_candidate|_rc' \
            | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | sort -V | tail -1 | cut -d' ' -f2)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Test FilesCore
        run: swift test --package-path ios/Packages/FilesCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ClaudeFilesAccess.xcodeproj \
            -scheme ClaudeFilesAccess \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Build ClaudeBridge.framework (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ClaudeFilesAccess.xcodeproj \
            -scheme ClaudeBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 100

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudeFilesAccess.app dist/Payload/
          cd dist && zip -qry ClaudeFilesAccess.ipa Payload && ls -la

      - name: Package ClaudeBridge kit
        run: |
          mkdir -p dist/ClaudeBridge
          cp -R build/Build/Products/Release-iphoneos/ClaudeBridge.framework dist/ClaudeBridge/
          # The framework is injected into another app, so it may only link system
          # libraries (FilesCore and zstd must be built into it).
          BIN=dist/ClaudeBridge/ClaudeBridge.framework/ClaudeBridge
          lipo -info "$BIN"
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +3 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "ClaudeBridge links a non-system library (listed above)"; exit 1
          fi
          nm -gU "$BIN" | grep -E 'ClaudeBridgeStarter|_ZSTD_decompressStream' | head -5
          cp tools/inject_claude_bridge.py dist/ClaudeBridge/
          cd dist/ClaudeBridge && zip -qry ../ClaudeBridge.framework.zip ClaudeBridge.framework && cd ..
          zip -qj ClaudeBridge-kit.zip ClaudeBridge.framework.zip ClaudeBridge/inject_claude_bridge.py
          unzip -l ClaudeBridge-kit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeFilesAccess-ipa
          path: dist/ClaudeFilesAccess.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-kit
          path: dist/ClaudeBridge-kit.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeFilesAccess.ipa
            dist/ClaudeBridge-kit.zip
