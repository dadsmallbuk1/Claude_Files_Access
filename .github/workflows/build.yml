name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    name: Relay (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    name: iOS app (tests + unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test FilesCore
        run: swift test --package-path ios/Packages/FilesCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ClaudeFilesAccess.xcodeproj \
            -scheme ClaudeFilesAccess \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudeFilesAccess.app dist/Payload/
          cd dist && zip -qry ClaudeFilesAccess.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeFilesAccess-ipa
          path: dist/ClaudeFilesAccess.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeFilesAccess.ipa
